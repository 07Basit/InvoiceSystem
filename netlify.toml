[build]
  base = "."
  command = "pnpm --filter frontend build"
  publish = "frontend/dist"

# Login uses an httpOnly SameSite=Strict cookie, so the browser must see the API on the SAME domain as the
# site. Netlify forwards /api/* to the backend on Render. This must stay ABOVE the SPA rule.
[[redirects]]
  from = "/api/*"
  to = "https://invoice-system-api-zqln.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200