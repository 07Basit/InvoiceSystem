[build]
  base = "."
  command = "pnpm --filter frontend build"
  publish = "frontend/dist"

# Login uses an httpOnly SameSite=Strict cookie, so the browser must see the API on the SAME domain as the
# site. Once the backend is deployed, uncomment this (it must stay ABOVE the SPA rule) and set its URL:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-HOST/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200